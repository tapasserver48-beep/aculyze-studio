services:
  - type: web
    name: aculyze-studio
    env: node
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    envVars:
      - key: NVIDIA_API_KEY
        value: nvapi-4pjOVOL7CR9r...
      - key: SEARCH_PROVIDER
        value: duckduckgo
      - key: AI_PROVIDER
        value: hybrid
      - key: LMS_API_KEY
        value: ak_live_...
      - key: ACULYZE_LMS_BASE_URL
        value: https://lm.aculyze.in/api/v1
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      # OmniVoice is LOCAL ONLY (requires localhost access). Disable on Render.
      - key: VOICE_PROVIDER
        value: disabled
      - key: HOSTING_ENV
        value: render
    plan: starter  # $7/month, 0.5 CPU, 512MB